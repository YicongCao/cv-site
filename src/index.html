<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pixelcao · 作品</title><link rel="preload" href="/fonts/ark-pixel/ark-pixel-12px-proportional-zh_hans.otf.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/style.css"></head>
<body>
<header><button class="brand" type="button" aria-label="关于 pixelcao" aria-haspopup="dialog">pixelcao</button><button id="overview" hidden aria-label="返回全景">返回全景</button><button id="open-gallery" aria-label="项目画廊" aria-haspopup="dialog"><svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h7v7H0zm9 0h7v7H9zM0 9h7v7H0zm9 0h7v7H9z"/></svg></button><button class="sound-toggle" data-sound-toggle type="button" aria-label="开启声音" aria-pressed="false"></button><a class="resume-link" href="/resume/" target="_blank" rel="noopener">简历 <span aria-hidden="true">↗</span></a></header>
<main><section id="timeline" aria-label="作品展厅">
<div class="intro"><h1 id="title" tabindex="0" role="button" aria-label="访问当前项目"></h1><p id="summary"></p><button class="dark" id="explore">查看项目 <span aria-hidden="true">↗</span></button></div>
<div id="stage" tabindex="0" aria-label="主题岛群，点击主题浏览，点击项目访问"><div id="cards"></div></div>
<div class="browse"><button id="previous" aria-label="上一个项目">←</button><button id="next" aria-label="下一个项目">→</button></div>

</section></main>
<dialog id="major-gallery" aria-labelledby="gallery-title"><div class="gallery-header"><h1 id="gallery-title">项目画廊</h1><button data-gallery-close aria-label="返回展厅">返回展厅 <span aria-hidden="true">×</span></button></div><div class="gallery-timeline"></div></dialog>
<dialog id="gallery-preview" aria-label="画廊图片"><button data-preview-close aria-label="关闭画廊图片">×</button><button data-preview-prev aria-label="上一张画廊图片">←</button><img alt=""><button data-preview-next aria-label="下一张画廊图片">→</button><a target="_blank" rel="noopener">打开原图 ↗</a></dialog>
<dialog id="detail" aria-labelledby="detail-title"><button class="sound-toggle" data-sound-toggle type="button" aria-label="开启声音" aria-pressed="false"></button><button id="close-detail" class="close" aria-label="关闭项目详情">×</button><div class="detail-layout"><div class="media-column"><div id="media" class="main-media"></div><div class="media-toolbar"><button id="expand" aria-label="放大当前素材">⤢</button></div></div><div class="detail-copy"><p id="detail-period"></p><h2 id="detail-title"></h2><div class="red-rule"></div><p id="detail-summary"></p><p id="ownership" hidden></p><div id="workflow" hidden></div><h3>我的工作</h3><ul id="contributions"></ul></div></div></dialog>
<dialog id="lightbox" aria-label="素材大图"><button class="sound-toggle" data-sound-toggle type="button" aria-label="开启声音" aria-pressed="false"></button><button id="close-lightbox" class="close" aria-label="关闭素材大图">×</button><div id="large-media"></div><div class="large-nav"><button id="large-prev" aria-label="上一份素材">←</button><button id="large-next" aria-label="下一份素材">→</button></div><a id="original-link" target="_blank" rel="noopener">打开原图 ↗</a></dialog>
<dialog id="about" aria-labelledby="about-title"><button class="sound-toggle" data-sound-toggle type="button" aria-label="开启声音" aria-pressed="false"></button><button id="close-about" class="close" aria-label="关闭个人简介">×</button><div id="about-content"></div></dialog>
<noscript><p>请启用 JavaScript 浏览作品展厅，或<a href="/resume/">查看完整简历</a>。</p></noscript>
<script src="/app.js" defer></script>
</body></html>
